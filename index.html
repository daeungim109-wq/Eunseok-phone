<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>iPhone Simulator Ultimate (Fix)</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e9edf2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;color:#171717}.phone{width:min(390px,100%);height:min(844px,calc(100dvh - 32px));min-height:600px;background:#111;border:7px solid #222;border-radius:48px;padding:8px;box-shadow:0 20px 60px #0003}.screen{height:100%;border-radius:34px;overflow:hidden;position:relative;background:#fff}.status{position:absolute;top:0;left:0;right:0;height:34px;padding:9px 22px;z-index:1000;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#fff;pointer-events:none;mix-blend-mode:difference}.island{position:absolute;z-index:1001;top:7px;left:50%;transform:translateX(-50%);height:25px;width:100px;background:#050505;border-radius:20px}.home{position:absolute;inset:0;padding:54px 17px 25px;background:linear-gradient(#0002,#0000 28%,#0003),linear-gradient(140deg, #1f1c2c, #928dab);display:flex;flex-direction:column;z-index:5}.clock{font-size:54px;font-weight:300;color:white;text-shadow:0 2px 8px #0006;margin-left:8px;text-align:left}.date{color:white;font-weight:650;text-shadow:0 1px 5px #0006;margin:0 0 auto 8px;font-size:16px}.widgetrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0;cursor:pointer}.widget{background:#ffffffc9;backdrop-filter:blur(10px);border-radius:18px;padding:11px;font-size:12px;min-height:78px;color:#111}.widget b{display:block;font-size:13px;margin-bottom:5px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;margin-bottom:15px;overflow-y:auto}.app{border:0;background:none;color:white;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;text-shadow:0 1px 4px #0009;cursor:pointer;min-width:0}.appicon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;box-shadow:0 3px 8px #0002;text-shadow:none;overflow:hidden;background-color:#fff}.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:auto;background:#ffffff70;backdrop-filter:blur(18px);padding:10px;border-radius:25px}.dock .appicon{width:46px;height:46px;font-size:22px;cursor:pointer}.homebar{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);height:4px;width:110px;background:#111;border-radius:4px;z-index:2000;cursor:pointer}

    /* 잠금화면 수정 (클릭 유실 방지 위함) */
    .lockscreen { position: absolute; inset: 0; background: linear-gradient(200deg, #0f2027, #203a43, #2c5364); z-index: 500; display: flex; flex-direction: column; padding: 60px 24px 40px; color: #fff; transition: transform 0.4s ease-out; cursor: pointer; }
    .lock-time { font-size: 64px; font-weight: 200; text-align: center; margin-bottom: 2px; }
    .lock-date { font-size: 18px; font-weight: 400; text-align: center; opacity: 0.9; margin-bottom: auto; }
    .swipe-up-hint { text-align: center; font-size: 13px; animation: bounce 2s infinite; opacity: 0.8; margin-bottom: 20px; font-weight: bold; color: #ff9f0a; }
    @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } 60% { transform: translateY(-4px); } }
    
    /* 암호 입력 화면 */
    .passcode-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); z-index: 501; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
    .passcode-dots { display: flex; gap: 16px; margin: 24px 0 40px; }
    .dot { width: 12px; height: 12px; border: 1.5px solid #fff; border-radius: 50%; transition: background 0.1s; }
    .dot.filled { background: #fff; }
    .passcode-grid { display: grid; grid-template-columns: repeat(3, 72px); gap: 16px 20px; }
    .passcode-btn { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 0; color: #fff; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .passcode-btn:active { background: rgba(255,255,255,0.4); }

    /* 앱 레이어 공통 사양 */
    .app-layer { display: none; flex-direction: column; height: 100%; background: #fff; position: absolute; inset: 0; z-index: 15; color: #000; }
    .app-layer.active { display: flex; }
    .app-header { padding: 45px 16px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid #e5e5e5; background: #f9f9f9; flex-shrink: 0; font-weight: bold; }
    .app-body { flex: 1; overflow-y: auto; background: #fff; }
    .back-btn { background: none; border: 0; color: #007aff; font-size: 15px; cursor: pointer; padding: 0; font-weight: 500; }

    /* 무신사 */
    .m-header-bar { background: #000; color: #fff; padding: 45px 16px 10px; display: flex; justify-content: space-between; font-weight: bold; }
    .m-banner { width: 100%; height: 120px; background: #111; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; font-size: 15px; }
    .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
    .m-item { border: 1px solid #eee; border-radius: 10px; padding: 10px; font-size: 12px; }
    .m-item-img { width: 100%; height: 110px; background: #f2f2f7; border-radius: 6px; margin-bottom: 6px; display: grid; place-items: center; font-size: 28px; }
    .m-buy-btn { width: 100%; background: #000; color: #fff; border: 0; padding: 6px; border-radius: 4px; margin-top: 6px; cursor: pointer; font-weight: bold; }

    /* 메모장 */
    .notes-list { padding: 12px; }
    .note-item { background: #f8f9fa; border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; border: 0.5px solid #eee; }
    .note-editor { display: none; flex-direction: column; height: 100%; background: #fff; padding: 16px; }
    .note-input-title { font-size: 22px; font-weight: bold; border: 0; outline: none; width: 100%; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .note-input-content { font-size: 15px; border: 0; outline: none; width: 100%; flex: 1; resize: none; }
    .checklist-box { margin-top: 15px; border-top: 1px solid #eee; padding-top: 12px; }
    .check-circle { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #bbb; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; margin-right: 8px; color: transparent; }
    .check-circle.checked { background: #ff9f0a; border-color: #ff9f0a; color: #fff; }

    /* 전화 */
    .p-display { font-size: 34px; text-align: center; padding: 25px 0; height: 80px; font-weight: 300; letter-spacing: 1px; }
    .p-grid { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; justify-content: center; }
    .p-btn { width: 72px; height: 72px; border-radius: 50%; background: #f2f2f7; border: 0; font-size: 26px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .p-btn:active { background: #e5e5ea; }
    .p-btn small { font-size: 9px; color: #555; font-weight: bold; margin-top: -2px; }

    /* 카카오톡 */
    .k-header { background: #fee500; color: #1e1e1e; padding: 45px 16px 10px; display: flex; justify-content: space-between; }
    .k-item { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 0.5px solid #f2f2f2; cursor: pointer; }
    .k-avatar { width: 46px; height: 46px; border-radius: 18px; background: #ff9f0a; display: grid; place-items: center; font-size: 22px; }
    .k-room { display: none; flex-direction: column; height: 100%; background: #bacbc7; }
    .k-chat-scroller { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .k-bubble { background: #fff; padding: 9px 12px; border-radius: 12px; max-width: 75%; font-size: 14px; align-self: flex-start; }
    .k-bubble.mine { background: #fee500; align-self: flex-end; }
    .k-input-area { background: #fff; padding: 8px 12px; display: flex; gap: 8px; border-top: 0.5px solid #ccc; }

    /* 시계 스톱워치 */
    .sw-view { background: #000; color: #fff; height: 100%; display: flex; flex-direction: column; }
    .sw-timer { font-size: 56px; font-family: monospace; text-align: center; padding: 50px 0; }
    .sw-row { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 0.5px solid #222; font-size: 14px; color: #ccc; }

    /* 캘린더 */
    .cal-container { padding: 12px; }
    .cal-matrix { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; margin-top: 10px; }
    .cal-cell { padding: 10px 0; font-size: 13px; cursor: pointer; border-radius: 8px; }
    .cal-cell.active-day { background: #ff3b30 !important; color: #fff !important; font-weight: bold; }

    /* 카메라 */
    .camera-box { background: #000; height: 100%; display: flex; flex-direction: column; color: #fff; }
    .camera-lens { flex: 1; background: #111; display: grid; place-items: center; font-size: 15px; text-align: center; color: #aaa; position: relative; overflow: hidden; }
    .camera-flash-overlay { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    .camera-dashboard { height: 120px; background: #000; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; }
    .cam-gallery-preview { width: 45px; height: 45px; border-radius: 8px; background: #333; overflow: hidden; display: grid; place-items: center; font-size: 20px; border: 1px solid rgba(255,255,255,0.3); }

    /* 인스타그램 */
    .i-story-tray { display: flex; gap: 12px; padding: 12px; border-bottom: 0.5px solid #dbdbdb; overflow-x: auto; }
