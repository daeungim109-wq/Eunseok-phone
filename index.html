<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>은석의 iPhone</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#111}.wall{position:fixed;inset:0;z-index:-1;background:linear-gradient(#0002,#0002),url("dog.jpg") center/cover}.phone{max-width:430px;min-height:100dvh;margin:auto}.home{min-height:100dvh;padding:15px 22px 24px;display:flex;flex-direction:column;text-shadow:0 1px 5px #0006}.status{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding:3px 5px}.battery{background:#fffd;color:#222;border-radius:8px;padding:2px 6px}.widget{display:flex;justify-content:space-between;margin-top:52px;min-height:135px}.time{font-size:clamp(64px,18vw,84px);font-weight:250;letter-spacing:-4px;line-height:1}.date{font-size:17px;margin-top:12px}.weather{text-align:right;padding-top:8px}.weather b{font-size:28px}.search{margin-top:clamp(45px,8vh,85px);display:flex;align-items:center;gap:10px;background:#f8f8f4e8;color:#555;border-radius:28px;height:52px;padding:0 14px;text-shadow:none}.google{font-size:25px;font-weight:bold;color:#4285f4}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}.search button{border:0;background:none;color:#555;font-size:20px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:23px 9px;margin-top:32px}.app{background:none;border:0;padding:0;color:#fff;font-size:12px;text-shadow:0 1px 4px #0008}.icon{height:62px;width:62px;border-radius:18px;margin:0 auto 7px;display:grid;place-items:center;font-size:30px;box-shadow:0 2px 8px #0002;text-shadow:none}.blue{background:linear-gradient(145deg,#36c5ff,#0875ed)}.photos{background:#fff;color:#f36}.camera{background:linear-gradient(145deg,#555,#111)}.settings{background:linear-gradient(145deg,#eee,#aaa);color:#444}.insta{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}.musinsa{background:#050505;font-weight:900;font-size:34px}.youtube{background:white;color:red}.naver{background:#03c75a;font-weight:900}.pages{display:flex;justify-content:center;gap:7px;margin-top:auto;padding-top:26px}.pages button{width:7px;height:7px;border:0;border-radius:50%;background:#ffffff80;padding:0}.pages .sel{background:white}.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px;padding:15px 8px 10px;background:#f5f5fa66;backdrop-filter:blur(22px);border:1px solid #ffffff30;border-radius:28px}.dock .icon{width:59px;height:59px;border-radius:17px}.homebar{height:5px;width:125px;background:white;border-radius:8px;margin:18px auto 0}.panel{display:none;position:fixed;z-index:5;inset:0;max-width:430px;margin:auto;background:#f4f4f8;color:#191a20;overflow:auto;padding:22px 20px 40px;text-shadow:none}.panel.show{display:block}.top{display:flex;justify-content:space-between;align-items:center;margin:14px 0 25px}.top h2{margin:0}.close{border:0;border-radius:50%;width:39px;height:39px;font-size:23px;background:#e5e6eb;color:#222}.card{background:white;border-radius:22px;padding:18px;margin:12px 0}.action{border:0;border-radius:13px;padding:11px 14px;background:#e8efff;color:#214e9a;margin:4px}.field{width:100%;border:0;border-radius:14px;background:#f0f1f5;padding:13px;margin:6px 0 10px}.chat{display:flex;flex-direction:column;gap:9px;max-height:50vh;overflow:auto}.bubble{max-width:85%;border-radius:18px;padding:11px 14px;overflow-wrap:anywhere;font-size:14px}.in{background:#e9eaf0;align-self:flex-start}.out{background:#d5e5ff;align-self:flex-end}.send{display:flex;gap:8px;margin-top:12px}.send input{flex:1;min-width:0;border:0;border-radius:20px;padding:12px;background:#f1f2f6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{aspect-ratio:3/4;overflow:hidden;position:relative;background:#e5e6ec;border-radius:14px}.tile img{width:100%;height:100%;object-fit:cover}.tile button{position:absolute;right:4px;top:4px}.note{font-size:11px;color:#888}video{width:100%;background:#111;border-radius:16px}
</style></head><body><div class="wall"></div><main class="phone"><div class="home">
<div class="status"><span id="smallTime">5:41</span><span>▮▮▮ ◉ <span class="battery">85</span></span></div>
<div class="widget"><div><div class="time" id="clock">5:41</div><div class="date" id="date">10월 18일</div></div><div class="weather"><b>🌤️ 17°</b><br><small>맑음 · 울산</small></div></div>
<form class="search" onsubmit="searchWeb(event)"><span class="google">G</span><input id="query" placeholder="Google 검색"><button>⌕</button></form>
<div class="apps" id="apps">
<button class="app" onclick="openUrl('https://www.apple.com/app-store/')"><div class="icon blue">A</div>App Store</button>
<button class="app" onclick="openPanel('gallery')"><div class="icon photos">✿</div>사진</button>
<button class="app" onclick="openPanel('camera')"><div class="icon camera">📷</div>카메라</button>
<button class="app" onclick="openPanel('settings')"><div class="icon settings">⚙</div>설정</button>
<button class="app" onclick="openUrl('https://www.instagram.com/')"><div class="icon insta">◎</div>Instagram</button>
<button class="app" onclick="openUrl('https://www.musinsa.com/')"><div class="icon musinsa">M</div>무신사</button>
<button class="app" onclick="openUrl('https://www.youtube.com/')"><div class="icon youtube">▶</div>YouTube</button>
<button class="app" onclick="openUrl('https://www.naver.com/')"><div class="icon naver">N</div>네이버</button></div>
<div class="pages"><button class="sel" onclick="page(1)"></button><button onclick="page(2)"></button><button onclick="page(3)"></button></div>
<div class="dock">
<button class="app" onclick="openPanel('phone')"><div class="icon" style="background:#22ce54">☎</div>전화</button>
<button class="app" onclick="openUrl('https://www.apple.com/safari/')"><div class="icon" style="background:#f8faff;color:#1675e9">🧭</div>Safari</button>
<button class="app" onclick="openPanel('messages')"><div class="icon" style="background:#28d653">●</div>메시지</button>
<button class="app" onclick="openUrl('https://music.youtube.com/')"><div class="icon" style="background:#ed2845">♫</div>음악</button></div><div class="homebar"></div></div>
<section class="panel" id="gallery"><div class="top"><h2>사진</h2><button class="close" onclick="closePanels()">×</button></div><div class="card"><label class="action">＋ 사진 추가<input hidden type="file" accept="image/*" multiple onchange="addPhotos(event)"></label><div class="grid" id="galleryGrid"></div><p class="note">사진은 브라우저에 저장돼.</p></div></section>
<section class="panel" id="messages"><div class="top"><h2>메시지</h2><button class="close" onclick="closePanels()">×</button></div><div class="card"><h3>송은석 · 가상 채팅</h3><div class="chat" id="chat"></div><form class="send" onsubmit="sendMessage(event)"><input id="msg" placeholder="iMessage"><button class="action">전송</button></form><button class="action" onclick="clearChat()">대화 지우기</button><p class="note">실제 인물에게 전송되지 않는 가상 채팅이야.</p></div></section>
<section class="panel" id="phone"><div class="top"><h2>전화</h2><button class="close" onclick="closePanels()">×</button></div><div class="card"><input class="field" id="number" type="tel" placeholder="전화번호"><button class="action" onclick="callNumber()">전화 앱 열기</button><p>기기의 전화 앱으로 연결을 요청해.</p></div></section>
<section class="panel" id="camera"><div class="top"><h2>카메라</h2><button class="close" onclick="stopCamera();closePanels()">×</button></div><div class="card"><video id="video" autoplay playsinline></video><p id="camStatus">카메라 권한이 필요해.</p><button class="action" onclick="startCamera()">카메라 켜기</button><button class="action" onclick="takePhoto()">촬영</button><button class="action" onclick="stopCamera()">끄기</button><a id="download" class="action" style="display:none" download="photo.jpg">사진 저장</a><canvas id="canvas" hidden></canvas></div></section>
<section class="panel" id="settings"><div class="top"><h2>설정</h2><button class="close" onclick="closePanels()">×</button></div><div class="card"><h3>은석의 iPhone</h3><p>iOS 스타일 홈 화면 데모</p><p>배경 사진을 바꾸려면 저장소의 dog.jpg 파일을 교체하면 돼.</p></div></section>
<section class="panel" id="generic"><div class="top"><h2 id="genericTitle">앱</h2><button class="close" onclick="closePanels()">×</button></div><div class="card" id="genericText"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
function clock(){let d=new Date(),h=d.getHours()%12||12,t=h+':'+String(d.getMinutes()).padStart(2,'0');$('clock').textContent=t;$('smallTime').textContent=t;let days=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];$('date').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+days[d.getDay()]}clock();setInterval(clock,30000);
function openUrl(u){window.open(u,'_blank','noopener')}function searchWeb(e){e.preventDefault();let q=$('query').value.trim();if(q)openUrl('https://www.google.com/search?q='+encodeURIComponent(q))}
function closePanels(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'));stopCamera()}function openPanel(id){closePanels();$(id).classList.add('show');if(id==='gallery')renderGallery();if(id==='messages')renderChat()}
function page(n){document.querySelectorAll('.pages button').forEach((b,i)=>b.classList.toggle('sel',i===n-1));let apps=$('apps');if(n===1){location.reload()}else if(n===2){apps.innerHTML=`<button class="app" onclick="openPanel('messages')"><div class="icon" style="background:#28d653">●</div>메시지</button><button class="app" onclick="openPanel('phone')"><div class="icon" style="background:#22ce54">☎</div>전화</button><button class="app" onclick="openUrl('https://www.instagram.com/')"><div class="icon insta">◎</div>Instagram</button><button class="app" onclick="openUrl('https://www.musinsa.com/')"><div class="icon musinsa">M</div>무신사</button>`}else{apps.innerHTML=`<button class="app" onclick="openUrl('https://www.naver.com/')"><div class="icon naver">N</div>네이버</button><button class="app" onclick="openUrl('https://www.youtube.com/')"><div class="icon youtube">▶</div>YouTube</button><button class="app" onclick="openPanel('gallery')"><div class="icon photos">✿</div>사진</button><button class="app" onclick="openPanel('settings')"><div class="icon settings">⚙</div>설정</button>`}}
const key='iphoneChatEunseok';function loadChat(){try{return JSON.parse(localStorage.getItem(key))||null}catch{return null}}function renderChat(){let a=loadChat()||[{who:'in',text:'뭐 해? 나 심심한데.'},{who:'in',text:'지금 나랑 얘기 좀 해.'}];localStorage.setItem(key,JSON.stringify(a));$('chat').innerHTML='';a.forEach(m=>{let b=document.createElement('div');b.className='bubble '+(m.who==='out'?'out':'in');b.textContent=m.text;$('chat').appendChild(b)})}
function sendMessage(e){e.preventDefault();let t=$('msg').value.trim();if(!t)return;let a=loadChat()||[];a.push({who:'out',text:t});localStorage.setItem(key,JSON.stringify(a));$('msg').value='';renderChat();setTimeout(()=>{let d=loadChat()||[];d.push({who:'in',text:['응, 듣고 있어.','오늘 하루 어땠어?','ㅋㅋ 그래서 어떻게 됐는데?'][Math.floor(Math.random()*3)]});localStorage.setItem(key,JSON.stringify(d));if($('messages').classList.contains('show'))renderChat()},600)}
function clearChat(){if(confirm('대화를 지울까?')){localStorage.removeItem(key);renderChat()}}
const gkey='iphoneGalleryImages';function addPhotos(e){[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{let a=[];try{a=JSON.parse(localStorage.getItem(gkey))||[]}catch{};a.push(r.result);try{localStorage.setItem(gkey,JSON.stringify(a));renderGallery()}catch{alert('저장 공간이 부족해. 작은 사진을 골라 줘.')}};r.readAsDataURL(f)});e.target.value=''}
function renderGallery(){let a=[];try{a=JSON.parse(localStorage.getItem(gkey))||[]}catch{};$('galleryGrid').innerHTML='';a.forEach((src,i)=>{let tile=document.createElement('div');tile.className='tile';let img=document.createElement('img');img.src=src;let b=document.createElement('button');b.textContent='×';b.onclick=()=>{let arr=JSON.parse(localStorage.getItem(gkey)||'[]');arr.splice(i,1);localStorage.setItem(gkey,JSON.stringify(arr));renderGallery()};tile.append(img,b);$('galleryGrid').append(tile)})}
function callNumber(){let n=$('number').value.replace(/[^\d+*#]/g,'');if(n)location.href='tel:'+n;else alert('전화번호를 입력해 줘.')}
let stream=null;async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;$('camStatus').textContent='카메라가 켜졌어.'}catch(e){$('camStatus').textContent='카메라 권한을 허용하고 HTTPS에서 열어 줘.'}}
function takePhoto(){let v=$('video');if(!stream||!v.videoWidth){$('camStatus').textContent='먼저 카메라를 켜 줘.';return}let c=$('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);$('download').href=c.toDataURL('image/jpeg',.9);$('download').style.display='inline-block';$('camStatus').textContent='촬영 완료! 사진 저장을 눌러 줘.'}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if($('video'))$('video').srcObject=null}
</script></body></html>
